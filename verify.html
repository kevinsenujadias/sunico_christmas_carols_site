<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Ticket check · Winter Vespers 2026</title>
  <link rel="icon" href="assets/img/sunico-logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body{min-height:100vh}
    .vf{max-width:520px;margin:0 auto;padding:1.2rem 1rem 3rem}
    .vf-top{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}
    .vf-top img{width:36px}
    .vf-top .script{font-size:1.7rem;color:var(--gold-2);line-height:1}
    .vf-top small{display:block;font-size:.65rem;letter-spacing:.22em;color:var(--muted)}
    .vf-card{border-radius:22px;overflow:hidden;background:#10183a;border:2px solid var(--line-2);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);animation:zoomIn .4s var(--ease)}
    .vf-face{display:block;width:100%;aspect-ratio:2964/1160;object-fit:cover}
    .vf-status{display:flex;align-items:center;gap:.9rem;padding:1.1rem 1.2rem;font-weight:800;font-size:1.35rem;letter-spacing:.02em}
    .vf-status .ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#0a0f1f}
    .vf-status .ic svg{width:30px;height:30px;stroke-width:3}
    .vf-status small{display:block;font-weight:500;font-size:.85rem;letter-spacing:0;opacity:.85;margin-top:.15rem}
    .valid  .vf-status{background:rgba(47,209,122,.14);color:#2fd17a}  .valid .ic{background:#2fd17a}  .valid{border-color:#2fd17a}
    .used   .vf-status{background:rgba(245,165,36,.14);color:#f5a524}  .used .ic{background:#f5a524}   .used{border-color:#f5a524}
    .bad    .vf-status{background:rgba(232,32,63,.14);color:#ff6b81}   .bad .ic{background:#e8203f;color:#fff} .bad{border-color:#e8203f}
    .wait   .vf-status{color:var(--muted)} .wait .ic{background:var(--panel-2);color:var(--muted)}
    .vf-body{padding:1rem 1.2rem 1.3rem;display:grid;gap:.9rem}
    .vf-seat{display:flex;gap:.6rem;flex-wrap:wrap}
    .vf-seat div{flex:1;min-width:80px;padding:.6rem .7rem;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
    .vf-seat small{display:block;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .vf-seat b{font-family:var(--f-serif);font-size:1.7rem;line-height:1.1}
    .vf-meta{color:var(--muted);font-size:.9rem;line-height:1.6}
    .vf-meta b{color:var(--text)}
    .vf-staff{margin-top:1rem;padding:1rem 1.2rem;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
    .vf-staff h3{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.7rem}
    .vf-staff form{display:flex;gap:.5rem}
    .vf-staff input{flex:1;min-width:0;padding:.75rem .9rem;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:inherit;letter-spacing:.3em;text-align:center}
    .vf-staff .btn{flex:none}
    .vf-foot{text-align:center;margin-top:1.4rem;font-size:.8rem;color:var(--dim)}
    .vf-foot a{color:var(--muted);text-decoration:underline}
    .tier-gold{color:var(--gold-2)} .tier-silver{color:var(--silver)} .tier-bronze{color:#e0a47a}
  </style>
</head>
<body>
  <main class="vf">
    <div class="vf-top">
      <img src="assets/img/sunico-logo.png" alt="SUNICO" />
      <div><span class="script">Winter Vespers</span><small>OFFICIAL TICKET CHECK</small></div>
    </div>

    <article class="vf-card wait" id="card">
      <img class="vf-face" src="assets/img/ticket-face.jpg" alt="Winter Vespers 2026" />
      <div class="vf-status"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="4 4"/></svg></span><div id="title">Checking ticket…<small id="sub">One moment</small></div></div>
      <div class="vf-body" id="body" hidden>
        <div class="vf-seat">
          <div><small>Row</small><b id="row">–</b></div>
          <div><small>Seat</small><b id="seat">–</b></div>
          <div><small>Tier</small><b id="tier">–</b></div>
        </div>
        <div class="vf-meta" id="meta"></div>
      </div>
    </article>

    <section class="vf-staff" id="staff" hidden>
      <h3>Door staff</h3>
      <div id="staffIn" hidden>
        <button class="btn btn-gold btn-block" id="checkInBtn">Check in this ticket</button>
        <button class="link-btn" id="signOut">Sign out of door mode</button>
      </div>
      <form id="pinForm" hidden>
        <input id="pin" type="password" inputmode="numeric" placeholder="Staff PIN" autocomplete="off" />
        <button class="btn btn-gold" type="submit">Sign in</button>
      </form>
    </section>

    <p class="vf-foot">Checked against SUNICO's live booking records.<br><a href="./">Winter Vespers tickets</a></p>
  </main>
  <div class="toast" id="toast"></div>
  <script src="js/verify.js"></script>
</body>
</html>
